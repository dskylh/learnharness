name: Sync Upstream

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    name: Sync upstream/main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main and tags
        run: |
          git remote add upstream https://github.com/amosblomqvist/learnharness.git || git remote set-url upstream https://github.com/amosblomqvist/learnharness.git
          git fetch upstream main --tags

      - name: Check for upstream changes
        id: check_upstream
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up-to-date with upstream/main."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has new commits to sync."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        if: steps.check_upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE_VERSION=$(node -p "require('./package.json').version")
          echo "Attempting test merge (current version: $PRE_VERSION)..."
          if git merge --no-commit --no-ff upstream/main; then
            POST_VERSION=$(node -p "require('./package.json').version")
            echo "Clean merge possible. Committing and pushing to main..."
            git commit -m "chore(sync): merge upstream updates from amosblomqvist/learnharness"
            git push origin main
            git push origin --tags || true

            if [ "$PRE_VERSION" != "$POST_VERSION" ]; then
              echo "Version changed from $PRE_VERSION to $POST_VERSION. Triggering AppImage release build..."
              gh workflow run appimage-release.yml --ref main
            elif ! gh release view "v$POST_VERSION" >/dev/null 2>&1; then
              echo "Release v$POST_VERSION does not exist yet. Triggering AppImage release build..."
              gh workflow run appimage-release.yml --ref main
            else
              echo "Version $POST_VERSION unchanged and release exists."
            fi
          else
            echo "Merge conflict detected! Creating PR for conflict resolution..."
            git merge --abort

            SYNC_BRANCH="upstream-sync-pending"
            git push origin upstream/main:refs/heads/"$SYNC_BRANCH" --force

            # Check if open PR already exists
            EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number -q '.[0].number')
            if [ -n "$EXISTING_PR" ]; then
              echo "PR #$EXISTING_PR is already open for $SYNC_BRANCH."
            else
              gh pr create \
                --base main \
                --head "$SYNC_BRANCH" \
                --title "Sync Upstream: Merge Conflict Detected" \
                --body "Automatic sync from upstream/main encountered merge conflicts. Please resolve the conflicts in this PR to integrate upstream changes into your main branch."
            fi
          fi

      - name: Ensure release exists for current version
        if: steps.check_upstream.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if ! gh release view "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Release v$CURRENT_VERSION does not exist. Triggering AppImage release build..."
            gh workflow run appimage-release.yml --ref main
          else
            echo "Release v$CURRENT_VERSION already exists."
          fi
